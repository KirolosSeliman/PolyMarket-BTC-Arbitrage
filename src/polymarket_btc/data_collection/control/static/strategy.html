<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choisir une stratégie</title>
<style>
:root {
  /* Deliberately pure black, not the app's usual near-black surface -- this
     page sits right before /live, which is also pure black, so the two
     read as one continuous space rather than a visible seam. */
  --surface-0: #000000; --surface-1: #111111; --surface-2: #1c1c1c;
  --text-1: #f2f2f0; --text-2: #b7b6b0; --muted: #7a7972;
  --border: rgba(255,255,255,0.12); --accent: #3987e5; --good: #3f9142; --critical: #d0554d;
  --builder: #a855f7;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-1);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
header { padding: 20px 24px 4px; flex: none; }
h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: 0.01em; }
header p { color: var(--muted); margin: 0; font-size: 12.5px; }

/* Toolbar -- pinned, never scrolls with the grid below it. */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 24px; flex: none; }
.toolbar .search-wrap { position: relative; flex: 1; min-width: 200px; }
.toolbar input[type="text"] {
  font: inherit; font-size: 13px; color: var(--text-1); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; width: 100%;
}
.toolbar input[type="text"]:focus { outline: none; border-color: var(--accent); }
.toolbar .new-strategy { display: flex; gap: 8px; align-items: center; }
.toolbar .new-strategy input[type="text"] { width: 180px; }
button {
  font: inherit; font-size: 12.5px; color: #fff; background: var(--accent);
  border: none; border-radius: 6px; padding: 9px 16px; cursor: pointer; white-space: nowrap;
}
button:hover { filter: brightness(1.1); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.secondary { color: var(--text-1); background: var(--surface-2); border: 1px solid var(--border); }
button.secondary:hover { border-color: var(--accent); filter: none; }
.hint { font-size: 11px; color: var(--muted); margin: 4px 0 0; padding: 0 24px; flex: none; }

/* Builder is a distinct tool, not another assembly action -- its own hue,
   a bit more heft, and a divider ahead of it so it reads as its own zone
   in the toolbar rather than a third button in the "new strategy" row. */
.toolbar .divider { width: 1px; align-self: stretch; background: var(--border); margin: 2px 2px; }
button.builder {
  color: #fff; background: var(--builder); font-weight: 600; padding: 9px 18px;
  display: inline-flex; align-items: center; gap: 7px;
}
button.builder:hover { filter: brightness(1.12); }

/* The scrollable region -- everything else on the page is pinned chrome
   around it, this is what "en déroulant" actually means mechanically. */
.grid-region { flex: 1; overflow-y: auto; padding: 4px 24px 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.strategy-card {
  position: relative; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 16px 14px; cursor: pointer; transition: border-color 0.15s, transform 0.15s;
}
.strategy-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.strategy-card .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.strategy-card h2 { font-size: 14.5px; margin: 0; word-break: break-word; }
.strategy-card .card-actions { display: flex; gap: 2px; flex-shrink: 0; }
.strategy-card .card-actions span {
  color: var(--muted); font-size: 14px; line-height: 1; padding: 3px 6px; border-radius: 4px; cursor: pointer;
}
.strategy-card .card-actions .edit:hover { color: #fff; background: var(--accent); }
.strategy-card .card-actions .delete:hover { color: #fff; background: var(--critical); }
.strategy-card .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.strategy-card .badge {
  font-size: 10.5px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 7px;
}
.strategy-card .chips { display: flex; gap: 10px; margin-top: 10px; font-size: 10.5px; color: var(--muted); }
.strategy-card .chip.on { color: var(--good); }
.strategy-card .updated { margin-top: 10px; font-size: 10.5px; color: var(--muted); }
.empty-state { color: var(--muted); font-size: 12.5px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Stratégies</h1>
  <p>Sélectionne une stratégie existante, pars d'une nouvelle, ou ouvre le Builder.</p>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <input type="text" id="strategy-search" placeholder="Rechercher une stratégie…" autocomplete="off">
  </div>
  <div class="new-strategy">
    <input type="text" class="name-input" id="new-strategy-name" placeholder="Nom de la stratégie" autocomplete="off">
    <button type="button" id="create-strategy-btn">+ Nouvelle stratégie</button>
  </div>
  <div class="divider"></div>
  <button type="button" class="builder" id="builder-btn">🛠 Builder</button>
</div>
<p class="hint" id="create-hint" style="display:none">Donne un nom à la stratégie avant de la construire.</p>

<div class="grid-region">
  <div class="cards" id="strategy-cards"></div>
  <div class="empty-state" id="empty-state" style="display:none"></div>
</div>

<script>
"use strict";

function el(id) { return document.getElementById(id); }

function escapeAttr(text) {
  return String(text).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Populated from /api/strategies on load -- each entry carries the rich
// metadata list_strategies() already returns (counts, has_execution/
// has_management/has_filter, updated_at_utc), no extra requests needed to
// drive the card grid below.
let allStrategies = [];

async function loadStrategies() {
  try {
    const res = await fetch("/api/strategies");
    const data = await res.json();
    allStrategies = data.strategies || [];
  } catch (error) {
    allStrategies = [];
  }
  renderCards(el("strategy-search").value);
}

function goToStrategy(name, { isNew = false } = {}) {
  const params = new URLSearchParams({ strategy: name });
  if (isNew) params.set("new", "1");
  // /menu is the 3-destination page (Trading en direct / Backtest /
  // Collecte de données) -- the strategy is chosen once, up front, then
  // carried along into whichever destination the user picks next.
  window.location.href = `/menu?${params.toString()}`;
}

function formatUpdatedAt(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch (error) {
    return iso;
  }
}

function renderCards(query) {
  const normalized = query.trim().toLowerCase();
  const filtered = normalized
    ? allStrategies.filter((s) => s.name.toLowerCase().includes(normalized))
    : allStrategies;
  const container = el("strategy-cards");
  const emptyState = el("empty-state");
  if (!filtered.length) {
    container.innerHTML = "";
    emptyState.style.display = "block";
    emptyState.textContent = allStrategies.length
      ? "Aucune stratégie trouvée."
      : "Aucune stratégie enregistrée -- crée-en une pour commencer.";
    return;
  }
  emptyState.style.display = "none";
  container.innerHTML = filtered.map((s) => `
    <div class="strategy-card" data-name="${escapeAttr(s.name)}">
      <div class="card-top">
        <h2>${escapeAttr(s.name)}</h2>
        <div class="card-actions">
          <span class="edit" data-edit="${escapeAttr(s.name)}" role="button" tabindex="0" aria-label="Modifier">✎</span>
          <span class="delete" data-delete="${escapeAttr(s.name)}" role="button" tabindex="0" aria-label="Supprimer">×</span>
        </div>
      </div>
      <div class="badges">
        <span class="badge">${s.concept_count} concept(s)</span>
        <span class="badge">${s.microsystem_count} microsystème(s)</span>
      </div>
      <div class="chips">
        <span class="chip ${s.has_execution ? "on" : ""}">${s.has_execution ? "✓" : "–"} exécution</span>
        <span class="chip ${s.has_management ? "on" : ""}">${s.has_management ? "✓" : "–"} gestion</span>
        <span class="chip ${s.has_filter ? "on" : ""}">${s.has_filter ? "✓" : "–"} filtre</span>
      </div>
      <div class="updated">Modifiée le ${escapeAttr(formatUpdatedAt(s.updated_at_utc))}</div>
    </div>
  `).join("");
}

async function deleteStrategy(name) {
  const confirmed = confirm(
    `Supprimer définitivement la stratégie "${name}" ?\n\nCette action est irréversible.`
  );
  if (!confirmed) return;
  let res;
  try {
    res = await fetch("/api/strategies/delete", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
  } catch (networkError) {
    alert(`Échec de la suppression : impossible de contacter le serveur (${networkError.message}).`);
    return;
  }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    alert(`Échec de la suppression : ${data.error || res.status}`);
    return;
  }
  allStrategies = allStrategies.filter((s) => s.name !== name);
  renderCards(el("strategy-search").value);
}

el("strategy-search").addEventListener("input", () => renderCards(el("strategy-search").value));

el("strategy-cards").addEventListener("click", (event) => {
  const deleteTarget = event.target.closest(".delete");
  if (deleteTarget) { deleteStrategy(deleteTarget.dataset.delete); return; }
  const editTarget = event.target.closest(".edit");
  if (editTarget) { window.location.href = `/strategy/build?name=${encodeURIComponent(editTarget.dataset.edit)}`; return; }
  const card = event.target.closest(".strategy-card");
  if (card) goToStrategy(card.dataset.name);
});

// --- "Nouvelle stratégie" ---

function createStrategy() {
  const name = el("new-strategy-name").value.trim();
  if (!name) {
    el("create-hint").style.display = "block";
    el("new-strategy-name").focus();
    return;
  }
  // The actual creation happens in the multi-step builder (concepts ->
  // configuration -> microsystèmes -> exécution) -- this page only picks
  // the name it'll be saved under.
  window.location.href = `/strategy/build?name=${encodeURIComponent(name)}`;
}

el("create-strategy-btn").addEventListener("click", createStrategy);
el("new-strategy-name").addEventListener("keydown", (event) => {
  if (event.key === "Enter") createStrategy();
});
el("new-strategy-name").addEventListener("input", () => { el("create-hint").style.display = "none"; });

// --- "Builder" -- creating/modifying/perfectionner-ing concepts,
// microsystèmes, profils d'exécution/de gestion, entirely separate from
// assembling one particular strategy, so it carries no query string. ---

el("builder-btn").addEventListener("click", () => { window.location.href = "/builder"; });

loadStrategies();
</script>
</body>
</html>
