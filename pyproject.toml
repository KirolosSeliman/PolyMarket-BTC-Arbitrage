[project]
name = "polymarket-btc"
version = "0.1.0"
description = "Read-only Polymarket BTC market data collection utilities."
requires-python = ">=3.11"
dependencies = [
    "websockets==16.1.1",
    "pyarrow==25.0.0",
    "zstandard==0.25.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polymarket_btc.data_collection.market_data.live_view" = ["static/*.html"]
