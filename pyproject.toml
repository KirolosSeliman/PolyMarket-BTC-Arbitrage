[project]
name = "polymarket-btc"
version = "0.1.0"
description = "Read-only Polymarket BTC market data collection utilities."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
