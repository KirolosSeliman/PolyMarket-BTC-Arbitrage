name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run offline tests
        run: python -m unittest

      - name: Compile Python sources
        run: python -m compileall src tests scripts

      - name: Validate production configuration
        run: >-
          python -m polymarket_btc.data_collection.market_data.cli
          validate-config --config config/market_data.toml

      - name: Run deterministic integrity and offline smoke tests
        run: >-
          python -m unittest
          tests.data_collection.market_data.test_reducer
          tests.data_collection.market_data.test_replay
          tests.data_collection.market_data.test_storage
          tests.data_collection.market_data.test_integration_offline
          tests.data_collection.market_data.test_gateway
          tests.data_collection.market_data.test_shutdown

      - name: Reject legacy Market Discovery references
        run: >-
          ! rg -n
          "preload_next_market|network-audit|clob_token_smoke|transition_detected|public-search|--once|--watch|--fixture|--validate-config|GammaNotFound|HTTP_TIMEOUT_SECONDS = 0.45"
          src README.md docs pyproject.toml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build production image
        run: docker build -t polymarket-btc-market-data:test .
